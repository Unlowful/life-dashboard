<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A0F08">
<title>Life Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --orange:      #F46B1A;
  --orange-dk:   #C4500E;
  --orange-lt:   rgba(244,107,26,0.16);
  --orange-glow: rgba(244,107,26,0.32);
  --bg:          #1A0F08;
  --surface:     #251509;
  --surface2:    #2E1A0E;
  --surface3:    #3A2212;
  --text:        #F5EDE4;
  --text-muted:  #C9915F;
  --text-dim:    #7A5040;
  --border:      rgba(244,107,26,0.12);
  --border-hi:   rgba(244,107,26,0.28);
  --safe-t:      env(safe-area-inset-top, 0px);
  --safe-b:      env(safe-area-inset-bottom, 0px);
  --nav-h:       64px;
}

html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  min-height: 100dvh;
  font-family: 'DM Sans', sans-serif;
  background: var(--bg); color: var(--text);
  overscroll-behavior: none; -webkit-font-smoothing: antialiased;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
}
body::after {
  content: ''; position: fixed; top: -120px; right: -120px;
  width: 360px; height: 360px;
  background: radial-gradient(circle, rgba(244,107,26,0.10) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none; z-index: 0;
}

#app { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; }

/* ── Header ── */
#hdr {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  padding: calc(var(--safe-t) + 16px) 18px 14px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  background: linear-gradient(to bottom, var(--bg) 70%, transparent);
}
.hdr-left { display: flex; flex-direction: column; gap: 2px; }
.hdr-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--orange); }
.hdr-title { font-family: 'DM Serif Display', serif; font-size: clamp(22px,6vw,30px); line-height: 1.1; color: var(--text); }
.hdr-title em { font-style: italic; color: var(--orange); }
.hdr-right { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex-shrink: 0; }

.date-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; background: var(--surface3); border-radius: 50px;
  border: 1px solid var(--border);
  font-size: 11px; font-weight: 600; color: var(--text-muted); white-space: nowrap;
}
.status-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; background: var(--surface3); border-radius: 50px;
  border: 1px solid var(--border);
  font-size: 11px; font-weight: 600; color: var(--text-dim); white-space: nowrap;
  transition: border-color .25s, color .25s;
}
.status-pill.ok { border-color: var(--border-hi); color: var(--orange); }
.sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; transition: background .3s, box-shadow .3s; }
.sdot.ok   { background: var(--orange); box-shadow: 0 0 7px var(--orange-glow); }
.sdot.err  { background: #ff6060; }
.sdot.spin { background: var(--orange); animation: pulse 1s ease-in-out infinite; }

.refresh-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; background: var(--surface3); border-radius: 50px;
  border: 1px solid var(--border);
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: background .15s, transform .1s;
}
.refresh-btn:active { background: var(--surface2); transform: scale(0.96); }
.refresh-btn.spinning svg { animation: spin .7s linear infinite; }
.refresh-btn svg { width: 12px; height: 12px; }

/* ── Screens ── */
.screen {
  position: absolute; inset: 0;
  top: calc(var(--safe-t) + 100px);
  bottom: calc(var(--nav-h) + var(--safe-b));
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 4px 16px 20px;
  opacity: 0; pointer-events: none;
  transition: opacity .18s ease;
}
.screen.active { opacity: 1; pointer-events: all; }
.screen::-webkit-scrollbar { width: 0; }

/* ── Nav ── */
#nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  cursor: pointer; color: var(--text-dim);
  font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  transition: color .15s; position: relative;
}
.nav-item svg { width: 21px; height: 21px; transition: transform .2s; }
.nav-item.active { color: var(--orange); }
.nav-item.active svg { transform: translateY(-1px); }
.nav-item::after {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 0; height: 2px; border-radius: 2px; background: var(--orange);
  transition: width .22s cubic-bezier(.34,1.56,.64,1);
}
.nav-item.active::after { width: 26px; }

/* ── Section header ── */
.sec-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--orange); margin-bottom: 2px; }
.sec-title   { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--text); line-height: 1.1; }
.sec-title em { font-style: italic; color: var(--orange); }
.sec-sub     { font-size: 11px; font-weight: 600; color: var(--text-dim); }

/* ── Cards ── */
.card {
  background: var(--surface); border-radius: 22px; border: 1px solid var(--border);
  padding: 20px 18px; margin-bottom: 10px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 6px 30px rgba(0,0,0,.45);
}
.card-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; }

/* ── Ring card ── */
.ring-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 24px; padding: 24px 20px 20px; margin-bottom: 10px;
  display: flex; flex-direction: column; align-items: center;
  box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 6px 30px rgba(0,0,0,.45);
}
.ring-wrap { position: relative; width: 168px; height: 168px; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); transform-origin: center; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ring-value { font-family: 'DM Serif Display', serif; font-size: 42px; color: var(--text); line-height: 1; }
.ring-unit  { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); }
.ring-glow  { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 88px; height: 88px; border-radius: 50%; background: radial-gradient(circle, rgba(244,107,26,.14) 0%, transparent 70%); pointer-events: none; }
.ring-footer { margin-top: 12px; font-size: 13px; font-weight: 500; color: var(--text-dim); }
.ring-footer strong { color: var(--orange); }

/* ── Chips ── */
.chips-2, .chips-3 { display: grid; gap: 8px; margin-bottom: 10px; }
.chips-2 { grid-template-columns: 1fr 1fr; }
.chips-3 { grid-template-columns: 1fr 1fr 1fr; }
.chip {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 18px; padding: 14px 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.3);
}
.chip-icon { margin-bottom: 5px; }
.chip-icon svg { width: 15px; height: 15px; }
.chip-value { font-family: 'DM Serif Display', serif; font-size: 26px; line-height: 1; color: var(--text); }
.chip-value small { font-family: 'DM Sans',sans-serif; font-size: 11px; font-weight: 500; color: var(--text-dim); }
.chip-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); margin-top: 3px; }

/* ── 2-col metrics ── */
.metrics-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.mc {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 18px; padding: 16px 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,.3);
}
.mc-label { font-size: 10px; font-weight: 700; letter-spacing: .10em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
.mc-value { font-family: 'DM Serif Display', serif; font-size: 34px; line-height: 1; color: var(--text); }
.mc-unit  { font-family: 'DM Sans',sans-serif; font-size: 14px; font-weight: 500; color: var(--text-dim); }
.mc-sub   { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }

/* ── Sleep bar ── */
.sleep-bar { height: 8px; border-radius: 5px; overflow: hidden; background: var(--surface3); display: flex; margin-bottom: 12px; }
.sleep-seg { height: 100%; transition: width .9s cubic-bezier(.4,0,.2,1); }
.sleep-seg.deep  { background: #8B7CF8; }
.sleep-seg.rem   { background: #A78BFA; opacity: .85; }
.sleep-seg.light { background: #60B0E0; opacity: .6; }
.sleep-seg.awake { background: var(--surface3); }
.sleep-legend { display: flex; flex-wrap: wrap; gap: 10px; }
.sleep-li   { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; color: var(--text-dim); }
.sleep-dot  { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }

/* ── Chart card ── */
.chart-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 18px; padding: 18px 16px; margin-bottom: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
}
.chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.chart-title  { font-size: 10px; font-weight: 700; letter-spacing: .10em; text-transform: uppercase; color: var(--text-dim); }
.chart-wrap   { position: relative; width: 100%; height: 160px; }

/* ── Tasks ── */
.task-group { margin-bottom: 20px; }
.task-date-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; padding-left: 2px; }
.task-row {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 6px;
  display: flex; align-items: flex-start; gap: 10px; transition: border-color .15s;
}
.task-row:active { border-color: var(--border-hi); }
.task-check svg  { width: 15px; height: 15px; color: var(--orange); margin-top: 1px; flex-shrink: 0; }
.task-text    { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.45; }
.task-project { font-size: 10px; font-weight: 600; color: var(--text-dim); margin-top: 3px; letter-spacing: .04em; }

/* ── Skeleton ── */
.skel {
  border-radius: 22px;
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s ease-in-out infinite;
}

/* ── Placeholder ── */
.ph { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; text-align: center; gap: 12px; padding: 36px; }
.ph-icon { width: 72px; height: 72px; border-radius: 50%; background: var(--orange-lt); border: 2px solid var(--border-hi); display: flex; align-items: center; justify-content: center; font-size: 30px; margin-bottom: 4px; animation: pop .4s cubic-bezier(.34,1.56,.64,1) both; }
.ph h2 { font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--text); }
.ph p  { font-size: 14px; color: var(--text-muted); line-height: 1.65; max-width: 260px; }
.empty { text-align: center; padding: 24px; font-size: 13px; color: var(--text-dim); font-weight: 500; }

/* ── Animations ── */
@keyframes fadeUp  { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
@keyframes pop     { from{transform:scale(.4);opacity:0} to{transform:scale(1);opacity:1} }
@keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.35} }
@keyframes spin    { to{transform:rotate(360deg)} }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

.anim    { animation: fadeUp .32s ease both; }
.anim-d1 { animation: fadeUp .32s .07s ease both; }
.anim-d2 { animation: fadeUp .32s .14s ease both; }
.anim-d3 { animation: fadeUp .32s .21s ease both; }
.anim-d4 { animation: fadeUp .32s .28s ease both; }

circle.prog-ring { transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1); }
</style>
</head>
<body>
<div id="app">

  <div id="hdr">
    <div class="hdr-left">
      <div class="hdr-eyebrow">Life Dashboard</div>
      <div class="hdr-title" id="hdr-title">Good <em>morning</em></div>
    </div>
    <div class="hdr-right">
      <div class="date-badge">📅 <span id="hdr-date">—</span></div>
      <div class="status-pill" id="status-pill">
        <div class="sdot spin" id="sdot"></div>
        <span id="sync-lbl">syncing</span>
      </div>
      <div class="refresh-btn" id="rfbtn" onclick="refresh()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M1 4v6h6M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
        Refresh
      </div>
    </div>
  </div>

  <div class="screen active" id="sc-today">
    <div class="skel" style="height:230px;margin-bottom:10px;margin-top:4px"></div>
    <div class="skel" style="height:90px;margin-bottom:10px"></div>
    <div class="skel" style="height:110px"></div>
  </div>
  <div class="screen" id="sc-health">
    <div class="skel" style="height:130px;margin-bottom:10px;margin-top:4px"></div>
    <div class="skel" style="height:200px;margin-bottom:10px"></div>
    <div class="skel" style="height:200px"></div>
  </div>
  <div class="screen" id="sc-tasks"><div id="tasks-body"></div></div>
  <div class="screen" id="sc-focus"><div id="focus-body"></div></div>

  <div id="nav"></div>
</div>

<script>
const WEBAPP    = 'https://script.google.com/macros/s/AKfycbzN2BVqMbOFlcqAtq08eEiD_0raS2dsegix3oYIkgFO-MKMbYspv0HG-rGtnAfoB-o6/exec';
const STEPGOAL  = 10000;
const SLEEPGOAL = 480;
const DAYS      = 7;

const SCREENS = [
  { id:'today',  label:'Today',  icon:iToday  },
  { id:'health', label:'Health', icon:iHealth },
  { id:'tasks',  label:'Tasks',  icon:iTasks  },
  { id:'focus',  label:'Focus',  icon:iFocus  },
];

const ST = { cur:'today', data:{daily_health:[],sleep:[],tasks:[],pomodoro:[]}, charts:{} };

function iToday(){return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`}
function iHealth(){return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`}
function iTasks(){return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`}
function iFocus(){return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3l4 4M19 3l-4 4"/></svg>`}

function buildNav(){
  document.getElementById('nav').innerHTML = SCREENS.map(s=>`
    <div class="nav-item${s.id===ST.cur?' active':''}" id="ni-${s.id}" onclick="go('${s.id}')">
      ${s.icon()}<span>${s.label}</span>
    </div>`).join('');
}

function go(id){
  if(id===ST.cur) return;
  document.getElementById('sc-'+ST.cur).classList.remove('active');
  document.getElementById('ni-'+ST.cur).classList.remove('active');
  ST.cur=id;
  document.getElementById('sc-'+id).classList.add('active');
  document.getElementById('ni-'+id).classList.add('active');
  draw(id);
}

function draw(id){
  if(id==='today')       drawToday();
  else if(id==='health') drawHealth();
  else if(id==='tasks')  drawTasks();
  else if(id==='focus')  drawFocus();
}

async function fetchAll(){
  if(WEBAPP.startsWith('YOUR_')){ noSetup(); return; }
  syncState('spin','syncing');
  const tabs=['daily_health','sleep','tasks','pomodoro'];
  const lims={daily_health:DAYS,sleep:DAYS,tasks:30,pomodoro:DAYS};
  const res = await Promise.allSettled(tabs.map(t=>fetchTab(t,lims[t])));
  res.forEach((r,i)=>{ if(r.status==='fulfilled') ST.data[tabs[i]]=r.value; });
  syncState('ok','synced');
  draw(ST.cur);
}

async function fetchTab(tab,limit=7){
  const r = await fetch(`${WEBAPP}?tab=${tab}&limit=${limit}&_=${Date.now()}`);
  if(!r.ok) throw new Error(r.status);
  const j = await r.json();
  return j.ok ? (j.rows||[]) : [];
}

async function refresh(){
  const b=document.getElementById('rfbtn');
  b.classList.add('spinning');
  await fetchAll();
  b.classList.remove('spinning');
}

function syncState(type,label){
  document.getElementById('sdot').className='sdot '+type;
  document.getElementById('status-pill').className='status-pill'+(type==='ok'?' ok':'');
  document.getElementById('sync-lbl').textContent=label;
}

function noSetup(){
  SCREENS.forEach(s=>{
    const el=document.getElementById('sc-'+s.id);
    if(el) el.innerHTML=`<div class="ph anim"><div class="ph-icon">⚙️</div><h2>Setup needed</h2><p>Set WEBAPP to your Google Apps Script URL to see your data.</p></div>`;
  });
  syncState('err','offline');
}

function drawToday(){
  const dh=ST.data.daily_health, slp=ST.data.sleep;
  const tod=dh.length?dh[dh.length-1]:null, ngt=slp.length?slp[slp.length-1]:null;
  const steps=n(tod?.steps)||0, totalCal=n(tod?.total_calories_burned)||0;
  const avgHr=n(tod?.avg_hr)||0, spo2=f(tod?.blood_oxygen_avg)||0;
  const distKm=f(tod?.distance_km)||0, activeCal=n(tod?.active_calories)||0;
  const pct=Math.min(steps/STEPGOAL,1), circ=2*Math.PI*50;
  const rc=pct>=1?'url(#g-green)':pct>=.5?'url(#g-orange)':'url(#g-amber)';
  const slpMin=n(ngt?.total_min)||0, deepM=n(ngt?.deep_min)||0;
  const remM=n(ngt?.rem_min)||0, lightM=n(ngt?.light_min)||0, awakeM=n(ngt?.awake_min)||0;
  const slpH=Math.floor(slpMin/60), slpMn=slpMin%60, slpTot=deepM+remM+lightM+awakeM||1;

  document.getElementById('sc-today').innerHTML=`<div>
    <div class="ring-card anim">
      <div class="ring-wrap">
        <div class="ring-glow"></div>
        <svg viewBox="0 0 116 116">
          <defs>
            <linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F46B1A"/><stop offset="100%" stop-color="#FFB340"/></linearGradient>
            <linearGradient id="g-green"  x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#F46B1A"/></linearGradient>
            <linearGradient id="g-amber"  x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFB340"/><stop offset="100%" stop-color="#F46B1A"/></linearGradient>
          </defs>
          <circle cx="58" cy="58" r="50" fill="none" stroke="rgba(244,107,26,.1)" stroke-width="9"/>
          <circle id="ring-prog" cx="58" cy="58" r="50" fill="none" stroke="${rc}" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${circ.toFixed(1)}" class="prog-ring"/>
        </svg>
        <div class="ring-center">
          <div class="ring-value">${steps>0?steps.toLocaleString():'–'}</div>
          <div class="ring-unit">steps</div>
        </div>
      </div>
      <div class="ring-footer"><strong>${Math.round(pct*100)}%</strong> of ${STEPGOAL.toLocaleString()} goal${distKm>0?` &nbsp;·&nbsp; ${distKm} km`:''}</div>
    </div>

    <div class="chips-3 anim-d1">
      <div class="chip">
        <div class="chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
        <div class="chip-value">${avgHr>0?Math.round(avgHr):'–'}<small> bpm</small></div>
        <div class="chip-label">avg hr</div>
      </div>
      <div class="chip">
        <div class="chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"><path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="2" x2="12" y2="9"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/></svg></div>
        <div class="chip-value">${slpMin>0?slpH+'h':'–'}<small>${slpMin>0?slpMn+'m':''}</small></div>
        <div class="chip-label">sleep</div>
      </div>
      <div class="chip">
        <div class="chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
        <div class="chip-value">${totalCal>0?totalCal.toLocaleString():'–'}</div>
        <div class="chip-label">cal burned</div>
      </div>
    </div>

    <div class="card anim-d2">
      <div class="card-label">Last night &nbsp;·&nbsp; ${slpMin>0?slpH+'h '+slpMn+'m':'no data'}</div>
      ${ngt&&slpMin>0?`
        <div class="sleep-bar">
          <div class="sleep-seg deep"  style="width:${(deepM/slpTot*100).toFixed(1)}%"></div>
          <div class="sleep-seg rem"   style="width:${(remM/slpTot*100).toFixed(1)}%"></div>
          <div class="sleep-seg light" style="width:${(lightM/slpTot*100).toFixed(1)}%"></div>
          <div class="sleep-seg awake" style="width:${(awakeM/slpTot*100).toFixed(1)}%"></div>
        </div>
        <div class="sleep-legend">
          ${deepM >0?`<div class="sleep-li"><div class="sleep-dot" style="background:#8B7CF8"></div>${deepM}m deep</div>`:''}
          ${remM  >0?`<div class="sleep-li"><div class="sleep-dot" style="background:#A78BFA"></div>${remM}m REM</div>`:''}
          ${lightM>0?`<div class="sleep-li"><div class="sleep-dot" style="background:#60B0E0"></div>${lightM}m light</div>`:''}
          ${awakeM>0?`<div class="sleep-li"><div class="sleep-dot" style="background:var(--surface3)"></div>${awakeM}m awake</div>`:''}
        </div>`:`<div class="empty">No sleep data yet</div>`}
    </div>

    <div class="chips-3 anim-d3">
      <div class="chip">
        <div class="chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg></div>
        <div class="chip-value">${spo2>0?spo2.toFixed(1):'–'}<small>%</small></div>
        <div class="chip-label">spo2</div>
      </div>
      <div class="chip">
        <div class="chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M3 12h1m8-9v1m8 8h1m-9 8v1M5.6 5.6l.7.7m11.4-.7l-.7.7m-11.4 11.4l.7-.7m11.4.7l-.7-.7"/></svg></div>
        <div class="chip-value">${activeCal>0?activeCal.toLocaleString():'–'}</div>
        <div class="chip-label">active cal</div>
      </div>
      <div class="chip">
        <div class="chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        <div class="chip-value" style="font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;padding-top:5px">${tod?.date?dateshort(tod.date):'–'}</div>
        <div class="chip-label">data date</div>
      </div>
    </div>
  </div>`;

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const el=document.getElementById('ring-prog');
    if(el) el.style.strokeDashoffset=(circ*(1-pct)).toFixed(1);
  }));
}

function drawHealth(){
  const dh=ST.data.daily_health, slp=ST.data.sleep;
  const aSteps=avg(dh,'steps'), aHr=avg(dh,'avg_hr');
  const aSpo2=avg(dh,'blood_oxygen_avg'), aSlp=avg(slp,'total_min');
  const aSlpH=Math.floor(aSlp/60), aSlpM=Math.round(aSlp%60);

  document.getElementById('sc-health').innerHTML=`<div>
    <div class="anim" style="margin-bottom:16px;padding-top:2px">
      <div class="sec-eyebrow">7-day averages</div>
      <div class="sec-title">Your <em>health</em></div>
    </div>
    <div class="metrics-2 anim-d1">
      <div class="mc"><div class="mc-label">Avg steps</div><div class="mc-value" style="color:var(--orange)">${aSteps>0?Math.round(aSteps).toLocaleString():'–'}</div><div class="mc-sub">${aSteps>0?Math.round(aSteps/STEPGOAL*100)+'% of goal':'no data'}</div></div>
      <div class="mc"><div class="mc-label">Avg sleep</div><div class="mc-value">${aSlp>0?aSlpH:'–'}<span class="mc-unit">${aSlp>0?'h '+aSlpM+'m':''}</span></div><div class="mc-sub">${aSlp>0?Math.round(aSlp/SLEEPGOAL*100)+'% of goal':'no data'}</div></div>
      <div class="mc"><div class="mc-label">Avg heart rate</div><div class="mc-value" style="color:var(--orange)">${aHr>0?Math.round(aHr):'–'}<span class="mc-unit">${aHr>0?' bpm':''}</span></div><div class="mc-sub">resting</div></div>
      <div class="mc"><div class="mc-label">Avg SpO₂</div><div class="mc-value">${aSpo2>0?aSpo2.toFixed(1):'–'}<span class="mc-unit">${aSpo2>0?'%':''}</span></div><div class="mc-sub">blood oxygen</div></div>
    </div>
    <div class="chart-card anim-d2">
      <div class="chart-header"><div class="chart-title">🗓 Daily steps</div></div>
      <div class="chart-wrap"><canvas id="ch-steps"></canvas></div>
    </div>
    <div class="chart-card anim-d3">
      <div class="chart-header"><div class="chart-title">💤 Sleep stages (min)</div></div>
      <div class="chart-wrap"><canvas id="ch-sleep"></canvas></div>
    </div>
  </div>`;

  requestAnimationFrame(()=>{ buildStepsChart(dh); buildSleepChart(slp); });
}

function buildStepsChart(rows){
  const el=document.getElementById('ch-steps'); if(!el) return;
  if(ST.charts.steps){ ST.charts.steps.destroy(); }
  const vals=rows.map(r=>n(r.steps)||0);
  ST.charts.steps=new Chart(el,{type:'bar',data:{labels:rows.map(r=>dayfmt(r.date)),datasets:[{data:vals,backgroundColor:vals.map(v=>v>=STEPGOAL?'rgba(244,107,26,0.85)':'rgba(244,107,26,0.18)'),borderRadius:7,borderSkipped:false}]},options:chartOpts('steps')});
}

function buildSleepChart(rows){
  const el=document.getElementById('ch-sleep'); if(!el) return;
  if(ST.charts.sleep){ ST.charts.sleep.destroy(); }
  ST.charts.sleep=new Chart(el,{type:'bar',data:{labels:rows.map(r=>dayfmt(r.date)),datasets:[
    {label:'Deep', data:rows.map(r=>n(r.deep_min)||0),  backgroundColor:'rgba(139,124,248,.9)',borderRadius:0,borderSkipped:false},
    {label:'REM',  data:rows.map(r=>n(r.rem_min)||0),   backgroundColor:'rgba(167,139,250,.75)',borderRadius:0,borderSkipped:false},
    {label:'Light',data:rows.map(r=>n(r.light_min)||0), backgroundColor:'rgba(96,176,224,.55)', borderRadius:0,borderSkipped:false},
    {label:'Awake',data:rows.map(r=>n(r.awake_min)||0), backgroundColor:'rgba(58,34,18,.9)',    borderRadius:0,borderSkipped:false},
  ]},options:{...chartOpts('min'),plugins:{...chartOpts('min').plugins,legend:{display:true,labels:{color:'rgba(122,80,64,.9)',boxWidth:9,boxHeight:9,font:{size:10,family:'DM Sans'},padding:12}}},scales:{x:{...chartOpts('min').scales.x,stacked:true},y:{...chartOpts('min').scales.y,stacked:true}}}});
}

function chartOpts(unit){
  return{responsive:true,maintainAspectRatio:false,animation:{duration:450,easing:'easeInOutQuart'},
    plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.raw.toLocaleString()} ${unit}`},backgroundColor:'#2E1A0E',titleColor:'#F5EDE4',bodyColor:'#C9915F',borderColor:'rgba(244,107,26,0.25)',borderWidth:1,padding:10,cornerRadius:8}},
    scales:{x:{grid:{display:false},ticks:{color:'#7A5040',font:{size:10,family:'DM Sans'}},border:{display:false}},y:{grid:{color:'rgba(244,107,26,0.06)'},ticks:{color:'#7A5040',font:{size:10,family:'DM Sans'},precision:0},border:{display:false},beginAtZero:true}}};
}

function drawTasks(){
  const tasks=ST.data.tasks;
  if(!tasks||tasks.length===0){ document.getElementById('tasks-body').innerHTML=`<div class="ph anim"><div class="ph-icon">✅</div><h2>Not connected yet</h2><p>Once Obsidian sync is configured, completed tasks will appear here grouped by day.</p></div>`; return; }
  const byDate={};
  tasks.forEach(t=>{ const d=datestr(t.date_completed); if(!byDate[d]) byDate[d]=[]; byDate[d].push(t); });
  const html=Object.keys(byDate).sort().reverse().map(date=>`
    <div class="task-group">
      <div class="task-date-label">${datelabel(date)}</div>
      ${byDate[date].map(t=>`<div class="task-row"><div class="task-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div><div style="flex:1;min-width:0"><div class="task-text">${t.task_text||'–'}</div>${t.project?`<div class="task-project">${t.project}</div>`:''}</div>${t.priority?`<div style="font-size:14px;flex-shrink:0;margin-top:1px">${t.priority}</div>`:''}</div>`).join('')}
    </div>`).join('');
  document.getElementById('tasks-body').innerHTML=`<div class="anim"><div style="margin-bottom:16px;padding-top:2px"><div class="sec-eyebrow">Obsidian sync</div><div class="sec-title"><em>Tasks</em></div></div><div style="font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:16px">${tasks.length} completed</div>${html}</div>`;
}

function drawFocus(){
  const pomo=ST.data.pomodoro;
  if(!pomo||pomo.length===0){ document.getElementById('focus-body').innerHTML=`<div class="ph anim"><div class="ph-icon">⏱️</div><h2>Not connected yet</h2><p>Once Obsidian Pomodoro sync is configured, your daily focus sessions will appear here.</p></div>`; return; }
  const totS=pomo.reduce((a,r)=>a+n(r.sessions),0), totM=pomo.reduce((a,r)=>a+n(r.focus_min),0);
  document.getElementById('focus-body').innerHTML=`<div class="anim"><div style="margin-bottom:16px;padding-top:2px"><div class="sec-eyebrow">Pomodoro log</div><div class="sec-title">Deep <em>focus</em></div></div><div class="metrics-2"><div class="mc"><div class="mc-label">Pomodoros</div><div class="mc-value" style="color:var(--orange)">${totS}</div><div class="mc-sub">total sessions</div></div><div class="mc"><div class="mc-label">Focus time</div><div class="mc-value">${Math.floor(totM/60)}<span class="mc-unit">h ${totM%60}m</span></div><div class="mc-sub">total focused</div></div></div></div>`;
}

function updateHeader(){
  const now=new Date();
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const h=now.getHours();
  const timeWord=h<5?'night':h<12?'morning':h<17?'afternoon':'evening';
  document.getElementById('hdr-date').textContent=`${days[now.getDay()]} ${months[now.getMonth()]} ${now.getDate()}`;
  document.getElementById('hdr-title').innerHTML=`Good <em>${timeWord}</em>`;
}

function n(v){ const x=parseInt(v); return isNaN(x)?0:x; }
function f(v){ const x=parseFloat(v); return isNaN(x)?0:x; }
function avg(rows,field){ const vals=rows.map(r=>f(r[field])).filter(v=>v>0); return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0; }
function datestr(val){ if(!val) return ''; if(val instanceof Date) return val.toISOString().split('T')[0]; return String(val).trim().split(/[T ]/)[0]; }
function dayfmt(val){ const d=new Date(datestr(val)+'T12:00:00'); return isNaN(d.getTime())?val:d.toLocaleDateString([],{weekday:'short'}); }
function dateshort(val){ const d=new Date(datestr(val)+'T12:00:00'); return isNaN(d.getTime())?val:d.toLocaleDateString([],{month:'short',day:'numeric'}); }
function datelabel(val){ const d=new Date(datestr(val)+'T12:00:00'); if(isNaN(d.getTime())) return val; const diff=Math.round((new Date().setHours(12,0,0,0)-d)/86400000); if(diff===0) return 'Today'; if(diff===1) return 'Yesterday'; return d.toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'}); }

updateHeader();
buildNav();
fetchAll();
setInterval(fetchAll, 30*60*1000);
</script>
